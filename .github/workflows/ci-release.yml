name: CI & Cross-Platform Release (.deb / .rpm / .AppImage / .tar.gz / .exe / .dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional; must match Cargo.toml when provided)"
        required: false
        type: string
      publish:
        description: "Publish GitHub Release from this manual run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # 0. Single source of truth for the release version. Every build job consumes this output.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version and validate release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zaluu") | .version')
          test -n "$version"

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            clean_input="${INPUT_VERSION#v}"
            if [[ "$clean_input" != "$version" ]]; then
              echo "::error::workflow_dispatch version '$INPUT_VERSION' does not match Cargo.toml version '$version'"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag commit $GITHUB_SHA is not on main"
              exit 1
            fi
          fi

  # Fast PR and push test suite without building all 9 OS release installers
  test:
    name: Cargo Test Suite (Linux x86_64)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
      - name: Run test suite
        run: cargo test --locked

  # 1. Universal Linux packages built on Ubuntu 22.04 LTS (glibc 2.35, statically linked libopus + sqlite3 + rustls)
  # Produces: .deb (Debian/Ubuntu/Mint/Kali/Pop!_OS), .rpm (Fedora/RHEL/Rocky/Alma/openSUSE), .AppImage (all distros), .tar.gz (Arch/Void/Gentoo/any distro)
  linux-packages:
    name: Linux Multi-Format (.deb / .rpm / .AppImage / .tar.gz)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev rpm file desktop-file-utils libfuse2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary (static libopus & sqlite3)
        run: |
          cargo build --release --locked --bin zaluu
          strip target/release/zaluu
          chmod +x packaging/linux/install.sh packaging/linux/uninstall.sh
      - name: Package .deb (Debian / Ubuntu 22.04+ / Linux Mint / Kali / Pop!_OS / Zorin)
        run: |
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zaluu pkg_deb/usr/bin/zaluu
          cp packaging/linux/zaluu.desktop pkg_deb/usr/share/applications/zaluu.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/zaluu.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: zaluu
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: Hồ Lưu Bảo Khang <khangholuubaoo@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/zaluu_${VERSION}_amd64.deb"
      - name: Package .rpm (Fedora / RHEL / Rocky / AlmaLinux / CentOS / openSUSE)
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/zaluu.spec << 'EOF'
          Name:           zaluu
          Version:        @VERSION@
          Release:        1
          Summary:        Native Zalo Desktop Client written in Rust
          License:        MIT OR Apache-2.0
          URL:            https://github.com/khanghmt122/zalo-rust
          BuildArch:      x86_64
          AutoReqProv:    no
          Requires:       alsa-lib, libX11, libxcb, libxkbcommon

          %description
          Lightweight native Zalo Desktop Client written in Rust (eframe/egui + ratatui).

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 755 %{_topdir}/../target/release/zaluu %{buildroot}/usr/bin/zaluu
          install -m 644 %{_topdir}/../packaging/linux/zaluu.desktop %{buildroot}/usr/share/applications/zaluu.desktop
          install -m 644 %{_topdir}/../src/assets/app_icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/zaluu.png

          %files
          /usr/bin/zaluu
          /usr/share/applications/zaluu.desktop
          /usr/share/icons/hicolor/256x256/apps/zaluu.png
          EOF
          sed -i "s/@VERSION@/${VERSION}/" rpmbuild/SPECS/zaluu.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/zaluu.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/zaluu-${VERSION}-1.x86_64.rpm"
      - name: Package .AppImage (Universal single-file executable for all Linux distros)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/zaluu AppDir/usr/bin/zaluu
          cp packaging/linux/zaluu.desktop AppDir/zaluu.desktop
          cp packaging/linux/zaluu.desktop AppDir/usr/share/applications/zaluu.desktop
          cp src/assets/app_icon.png AppDir/zaluu.png
          cp src/assets/app_icon.png AppDir/.DirIcon
          cp src/assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/zaluu.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ $# -eq 0 ]; then
              exec "${HERE}/usr/bin/zaluu" --gui
          else
              exec "${HERE}/usr/bin/zaluu" "$@"
          fi
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/zaluu-${VERSION}-x86_64.AppImage"
          chmod +x "dist/zaluu-${VERSION}-x86_64.AppImage"
      - name: Package portable .tar.gz with universal install.sh (Arch / Manjaro / Gentoo / Void / any Linux)
        run: |
          STAGE="zaluu-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/zaluu "$STAGE/zaluu"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/zaluu.desktop "$STAGE/zaluu.desktop"
          cp src/assets/app_icon.png "$STAGE/zaluu.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zaluu" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: zaluu-linux-packages
          path: dist/*

  # 2. Legacy Linux build on Debian 11 Bullseye (glibc 2.31) for older distros (Ubuntu 20.04, Debian 11, Mint 20, RHEL/Rocky 8.x/9.x)
  linux-legacy-glibc231:
    name: Linux Legacy glibc 2.31 (Debian 11 / Ubuntu 20.04+)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    container:
      image: rust:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies & update Rust stable (Debian 11 Bullseye)
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-upgrade build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bullseye-glibc231
      - name: Build legacy release binary & .deb + .tar.gz
        run: |
          cargo build --release --locked --bin zaluu
          strip target/release/zaluu
          chmod +x packaging/linux/install.sh packaging/linux/uninstall.sh
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zaluu pkg_deb/usr/bin/zaluu
          cp packaging/linux/zaluu.desktop pkg_deb/usr/share/applications/zaluu.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/zaluu.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: zaluu
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libasound2 | libasound2t64
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: Hồ Lưu Bảo Khang <khangholuubaoo@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust (glibc 2.31+ compatible)
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/zaluu_${VERSION}_legacy_glibc2.31_amd64.deb"

          STAGE="zaluu-${VERSION}-linux-x86_64-legacy-glibc2.31"
          mkdir -p "$STAGE"
          cp target/release/zaluu "$STAGE/zaluu"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/zaluu.desktop "$STAGE/zaluu.desktop"
          cp src/assets/app_icon.png "$STAGE/zaluu.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zaluu" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: zaluu-linux-legacy
          path: dist/*

  windows-exe:
    name: Windows (MSVC x86_64 + .exe)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary & installer
        shell: pwsh
        run: |
          cargo build --release --locked --bin zaluu
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\zaluu.exe "dist\zaluu-$($env:VERSION)-portable-windows-x86_64.exe"
          Compress-Archive -Path "dist\zaluu-$($env:VERSION)-portable-windows-x86_64.exe","README.md","LICENSE-MIT","LICENSE-APACHE" -DestinationPath "dist\zaluu-$($env:VERSION)-portable-windows-x86_64.zip" -Force
          iscc "/DMyAppVersion=$($env:VERSION)" packaging\windows\installer.iss
          Move-Item dist\zaluu-setup-windows-x86_64.exe "dist\zaluu-$($env:VERSION)-setup-windows-x86_64.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: zaluu-windows-exe
          path: |
            dist/*.exe
            dist/*.zip

  macos-dmg:
    name: macOS (Apple Silicon arm64 + Intel x86_64 + Universal .dmg)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      LIBOPUS_STATIC: "1"
      LIBOPUS_NO_PKG: "1"
      OPUS_STATIC: "1"
      OPUS_NO_PKG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Ensure CMake is available (without Homebrew dynamic libopus)
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
      - name: Run test suite
        run: |
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo test --locked
      - name: Build release binaries (Apple Silicon arm64 + Intel x86_64 + Universal) & .dmg packages
        run: |
          set -euo pipefail
          VER="${VERSION:-0.0.3}"

          echo "=== [1/4] Building Apple Silicon (aarch64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo build --release --locked --target aarch64-apple-darwin --bin zaluu

          echo "=== [2/4] Building Mac Intel (x86_64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-x86_64.cmake" \
            cargo build --release --locked --target x86_64-apple-darwin --bin zaluu

          echo "=== [3/4] Creating Universal Binary (arm64 + x86_64) via lipo ==="
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/zaluu \
            target/x86_64-apple-darwin/release/zaluu \
            -output target/universal-apple-darwin/release/zaluu
          lipo -info target/universal-apple-darwin/release/zaluu

          echo "=== Verifying zero Homebrew dynamic library dependencies ==="
          otool -L target/aarch64-apple-darwin/release/zaluu
          otool -L target/x86_64-apple-darwin/release/zaluu
          if otool -L target/universal-apple-darwin/release/zaluu | grep -E '/opt/homebrew|/usr/local'; then
            echo "ERROR: Binary still links against Homebrew dylib!"
            exit 1
          fi

          echo "=== Generating AppIcon.icns from src/assets/app_icon.png ==="
          mkdir -p build_icon/AppIcon.iconset
          for sz in 16 32 128 256 512; do
            sips -s format png -z $sz $sz src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -s format png -z $sz2 $sz2 src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns build_icon/AppIcon.iconset -o build_icon/AppIcon.icns || true

          mkdir -p dist

          package_dmg() {
            local bin_path="$1"
            local dmg_out="$2"
            local vol_name="$3"
            local stage_dir
            stage_dir="$(mktemp -d)"
            mkdir -p "$stage_dir/zaluu.app/Contents/MacOS"
            mkdir -p "$stage_dir/zaluu.app/Contents/Resources"
            cp "$bin_path" "$stage_dir/zaluu.app/Contents/MacOS/zaluu"
            chmod +x "$stage_dir/zaluu.app/Contents/MacOS/zaluu"
            case "$bin_path" in
              target/aarch64-*) swift_targets="arm64-apple-macosx11.0" ;;
              target/x86_64-*) swift_targets="x86_64-apple-macosx11.0" ;;
              *) swift_targets="arm64-apple-macosx11.0,x86_64-apple-macosx11.0" ;;
            esac
            # Public builds deliberately omit externally licensed codec JS/WASM.
            env -u HISTORY_CODEC_ASSETS SWIFT_TARGETS="$swift_targets" bash native/macos/build-native-helpers.sh "$stage_dir/zaluu.app"
            helper_arches="$(lipo -archs "$bin_path" | xargs | tr ' ' ',')"
            python3 packaging/macos/validate-native-bundle.py "$stage_dir/zaluu.app" --arches "$helper_arches"
            cp packaging/macos/Info.plist "$stage_dir/zaluu.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VER" "$stage_dir/zaluu.app/Contents/Info.plist"
            printf 'APPL????' > "$stage_dir/zaluu.app/Contents/PkgInfo"
            if [ -f build_icon/AppIcon.icns ]; then
              cp build_icon/AppIcon.icns "$stage_dir/zaluu.app/Contents/Resources/AppIcon.icns"
            fi
            xattr -cr "$stage_dir/zaluu.app" || true
            codesign --force --sign - "$stage_dir/zaluu.app/Contents/Helpers/DailyNotifier.app"
            codesign --force --deep --sign - "$stage_dir/zaluu.app"
            codesign --verify --deep --strict "$stage_dir/zaluu.app"
            ln -s /Applications "$stage_dir/Applications"

            for attempt in 1 2 3 4 5; do
              if hdiutil create -volname "$vol_name" -srcfolder "$stage_dir" -ov -fs HFS+ -format UDZO "$dmg_out"; then
                break
              fi
              echo "hdiutil attempt $attempt failed, retrying in 3s..."
              sleep 3
            done
            rm -rf "$stage_dir"
            test -f "$dmg_out"
          }

          echo "=== [4/4] Packaging .dmg installers (Apple Silicon, Intel, Universal) ==="
          package_dmg "target/aarch64-apple-darwin/release/zaluu" "dist/zaluu-${VER}-macos-arm64.dmg" "zaluu (Apple Silicon)"
          package_dmg "target/x86_64-apple-darwin/release/zaluu" "dist/zaluu-${VER}-macos-x86_64.dmg" "zaluu (Intel)"
          package_dmg "target/universal-apple-darwin/release/zaluu" "dist/zaluu-${VER}-macos.dmg" "zaluu"
          python3 tests/native_packaging.py
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: zaluu-macos-dmg
          path: dist/*.dmg
  release:
    name: Publish GitHub Release
    needs: [prepare, linux-packages, linux-legacy-glibc231, windows-exe, macos-dmg]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && needs.prepare.result == 'success' && needs.linux-packages.result == 'success' && needs.linux-legacy-glibc231.result == 'success' && needs.windows-exe.result == 'success' && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt & latest.json update manifest
        run: |
          set -euo pipefail
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          VER="${VERSION}"
          TAG="${TAG_NAME}"
          python3 - << 'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          ver = os.environ["VERSION"]
          tag = os.environ["TAG_NAME"]
          repo = "https://github.com/khanghmt122/zalo-rust"
          assets = []
          for line in Path("SHA256SUMS.txt").read_text().splitlines():
              parts = line.strip().split(None, 1)
              if len(parts) != 2:
                  continue
              sha256_hex, name = parts[0], parts[1].lstrip("*")
              p = Path(name)
              if not p.is_file():
                  continue
              assets.append({
                  "name": name,
                  "sha256": sha256_hex,
                  "size": p.stat().st_size,
                  "browser_download_url": f"{repo}/releases/download/{tag}/{name}",
              })
          manifest = {
              "schema_version": 1,
              "version": ver,
              "tag_name": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repository": repo,
              "release_url": f"{repo}/releases/tag/{tag}",
              "assets": assets,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cat SHA256SUMS.txt
          cat latest.json
      # Install instructions live in docs/CAI_DAT.md. The release body includes
      # concise Vietnamese highlights so the in-app GitHub Releases API updater
      # renders exact bug fixes and feature updates directly inside zaluu.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: zaluu ${{ needs.prepare.outputs.tag_name }} — macOS Native, Gallery Viewer, Auto-Sync Media & Voice Message
          files: release_assets/*
          generate_release_notes: true
          body: |
            > **Mã nguồn & Giấy phép:** [MIT OR Apache-2.0](https://github.com/khanghmt122/zalo-rust) · **Tác giả:** Hồ Lưu Bảo Khang <khangholuubaoo@gmail.com>
            >
            > Chọn đúng gói trong mục **Assets** bên dưới cho hệ điều hành của bạn:
            > - **macOS:** Hỗ trợ Apple Silicon M1/M2/M3/M4 (`zaluu-*-macos-arm64.dmg`), Mac Intel (`zaluu-*-macos-x86_64.dmg`) & Universal (`zaluu-*-macos.dmg`).
            > - **Windows:** File cài đặt Setup (`zaluu-*-setup-windows-x86_64.exe`) hoặc bản Portable (`zaluu-*-portable-windows-x86_64.zip`).
            > - **Linux:** `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), `.AppImage` (mọi distro) & `.tar.gz` di động.

            ### ✨ Tính năng mới nổi bật trong ${{ needs.prepare.outputs.tag_name }}
            - **Giao diện macOS Native (macOS First):** Nút điều khiển cửa sổ macOS Traffic Lights (Đỏ - Vàng - Xanh) chuẩn Apple ở góc trên bên trái, loại bỏ các nút Windows thô kệch.
            - **Bộ phím tắt macOS Native:**
              - `Cmd + Q`: Thoát ứng dụng mượt mà, ngắt kết nối an toàn.
              - `Cmd + ,`: Mở nhanh Cài đặt (Preferences).
              - `Cmd + W`: Đóng trình xem ảnh / modal đang mở, hoặc ẩn cửa sổ (Minimize).
              - `Cmd + F`: Nhảy nhanh vào thanh tìm kiếm trong cuộc trò chuyện.
              - `Cmd + K`: Focus thanh tìm kiếm hội thoại / danh bạ / SĐT ở sidebar.
              - `Cmd + 1` .. `Cmd + 9`: Chuyển nhanh giữa các cuộc trò chuyện.
            - **Trình xem ảnh đa năng (Thread Gallery Viewer):**
              - Lướt xem toàn bộ album ảnh trong cuộc trò chuyện bằng phím `←` / `→` hoặc nút mũi tên nổi 2 bên.
              - Hiển thị thứ tự ảnh (vd: `3/14`).
              - `Cmd + S` / Nút "Lưu ảnh": Lưu thẳng ảnh gốc vào thư mục `~/Downloads` và tự động hiển thị trong Finder.
              - `Cmd + C` / Nút "Sao chép": Copy trực tiếp dữ liệu ảnh PNG vào clipboard hệ thống macOS để dán (`Cmd + V`) vào bất kỳ ứng dụng nào khác.
              - Zoom mượt mà bằng Trackpad 2 ngón, chuột cuộn hoặc phím `+` / `-` / `100%`.
            - **Tự động quét & nạp ảnh ZaloData ngầm:** Tự động giải nén và chuyển đổi các ảnh mới `.jxl` từ ZaloData vào bộ nhớ cục bộ `zalo_history.db` khi khởi động.
            - **Ghi âm & gửi tin nhắn thoại (Voice Message):** Ghi âm trực tiếp từ microphone máy tính qua `cpal`, đồng hồ đếm giây thời gian thực, gửi nhanh vào cuộc trò chuyện.
            - **Cơ chế cập nhật tự động 1-Click:** Tự động thông báo khi có bản cập nhật mới trên GitHub Releases và cập nhật chỉ với 1 click.
